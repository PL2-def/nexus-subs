name: Keep Render server awake

# Render Free met le serveur en veille après 15 min sans visite (réveil ~50 s).
# Ce ping régulier le garde éveillé (750 h gratuites/mois = suffisant pour 1 service 24/7).
# URL configurable via la variable de dépôt RENDER_URL (Settings > Secrets and variables > Actions > Variables).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping server
        env:
          URL: ${{ vars.RENDER_URL || 'https://nexus-subs.onrender.com' }}
        run: |
          curl -sS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 \
            -o /dev/null -w "HTTP %{http_code} en %{time_total}s\n" "$URL/api/bootstrap" \
            || echo "::warning::Serveur injoignable sur $URL"
